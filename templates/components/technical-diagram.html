<!-- Full-width conceptual SVG; raster figures must omit diagram-vector to avoid upscaling.
     For light/dark variants use theme-topology.html with technical-diagram diagram-vector. -->
<figure class="figure technical-diagram diagram-vector">
  <button type="button" data-lightbox data-caption="{{DIAGRAM_CAPTION}}">
    <img src="{{DIAGRAM_SVG}}" alt="{{DIAGRAM_ALT}}" loading="lazy">
  </button>
  <figcaption>{{DIAGRAM_CAPTION}}</figcaption>
</figure>
